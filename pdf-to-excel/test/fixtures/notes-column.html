<html><body style="font-family:Arial;font-size:8px;margin:0">
<!-- Report-style table laid out by position only (no ruling lines), like the Lyme property list:
     - the longest owner name / location ends 3px before the next column starts
       (each appears on two rows, enough to bridge the column gap if they were joined)
     - some Land amounts carry a trailing "cu" note that should become its own column
     Rows are generated by the script below so every field starts at a fixed x. -->
<style>div{position:absolute;white-space:nowrap} .r{text-align:right}</style>
<script>
const LONG_NAME = "LONG FAMILY REVOCABLE TRUST DATED 1/10/2025", LONG_LOC = "DARTMOUTH COLLEGE HWY";
const rows = [
  ["Owner", "Map Lot", "Location", "Use", "Land", "", "Total", true],
  ["SMITH JOHN", "00401 00012", "2 MAIN ST", "1F RES", "178,900", "", "1,026,000"],
  [LONG_NAME, "00402 00050", "14 RIVER RD", "2F RES", "180,130", "cu", "980,730"],
  [LONG_NAME, "00402 00051", "16 RIVER RD", "1F RES", "92,000", "", "410,000"],
  ["JONES MARY", "00403 00007", "85 " + LONG_LOC, "1F RES", "3,807", "cu", "3,807"],
  ["ADAMS LEE", "00403 00008", "85 " + LONG_LOC, "1F RES", "63", "cu", "63"],
  ["BROWN ALEX", "00405 00008", "9 ACORN HILL RD", "1F RES", "191,495", "cu", "598,795"],
  ["GREEN PAT", "00406 00033", "117 BRECK HILL RD", "FARM L", "4,609", "cu", "4,609"],
  ["WHITE SAM", "00407 00090", "1 PINNACLE RD", "1F RES", "231,800", "", "706,300"],
];
const ctx = document.createElement("canvas").getContext("2d");
ctx.font = "8px Arial";
const width = t => ctx.measureText(t).width;
// x positions (px): the next column starts 3px after the longest owner / street.
const OWNER = 30, MAP = OWNER + width(LONG_NAME) + 3, NUM_END = MAP + 90, STREET = NUM_END + 2;
const USE = STREET + width(LONG_LOC) + 3, LAND_END = USE + 85, NOTE = LAND_END + 2, TOTAL_END = NOTE + 80;
const at = (x, y, text, style = "") => document.write(`<div style="${style}left:${x}px;top:${y}px">${text}</div>`);
const rightAt = (x, y, text, style = "") => document.write(`<div class="r" style="${style}right:${816 - x}px;top:${y}px">${text}</div>`);
let y = 40;
for (const [owner, map, loc, use, land, note, total, head] of rows) {
  const b = head ? "font-weight:bold;" : "";
  at(OWNER, y, owner, b);
  at(MAP, y, map, b);
  if (head) at(NUM_END - 20, y, loc, b);
  else { const [num, ...street] = loc.split(" "); rightAt(NUM_END, y, num); at(STREET, y, street.join(" ")); }
  at(USE, y, use, b);
  rightAt(LAND_END, y, land, b);
  if (note) at(NOTE, y, note);
  rightAt(TOTAL_END, y, total, b);
  y += 12;
}
</script>
</body></html>
